plugins {
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "quarryindustrial" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
    // Source set src/gametest + tarea runGameTest (server headless que corre los @GameTest y termina)
    configureTests {
        createSourceSet = true
        modId = "quarryindustrial-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    // Modrinth Maven: solo para cargar Ala Industrial en el cliente de desarrollo (runClient)
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Team Reborn Energy: la API de energía que usan Ala Industrial y Tech Reborn (1 EU = 1 unidad).
    // include() la mete dentro de nuestro jar, así el server no necesita instalarla aparte.
    include(implementation("teamreborn:energy:${project.energy_version}"))

    // Ala Industrial solo en runtime (runClient y gametests): sus cables, generadores, el fluido de
    // petróleo (#c:oil) y los géiseres. No se compila contra sus clases: la dependencia es blanda.
    // Con -PnoAla se corre sin Ala (para probar que el mod anda solo y carga las recetas vanilla)
    if (!project.hasProperty("noAla")) {
        runtimeOnly "maven.modrinth:ala-industrial:${project.ala_version}"
    }

    // Compatibilidad opcional: se compila contra sus APIs, pero no se incluyen ni son obligatorios.
    // Jade (info al mirar un bloque), JEI y REI (páginas de información de las máquinas).
    compileOnly "maven.modrinth:jade:${project.jade_version}"
    compileOnly "maven.modrinth:jei:${project.jei_version}"
    compileOnly "maven.modrinth:rei:${project.rei_version}"
    // REI usa tipos de Architectury en sus firmas: hace falta para compilar
    compileOnly "maven.modrinth:architectury-api:${project.architectury_version}"
    // Para probarlos en el cliente de desarrollo: -PwithJade, -PwithJei, -PwithRei
    if (project.hasProperty("withJade")) {
        runtimeOnly "maven.modrinth:jade:${project.jade_version}"
    }
    if (project.hasProperty("withJei")) {
        runtimeOnly "maven.modrinth:jei:${project.jei_version}"
    }
    if (project.hasProperty("withRei")) {
        runtimeOnly "maven.modrinth:rei:${project.rei_version}"
        runtimeOnly "maven.modrinth:architectury-api:${project.architectury_version}"
        runtimeOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
